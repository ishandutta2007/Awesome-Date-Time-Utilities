<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>

    <style>
      .clock-ring {
        transform-origin: 1040px 180px;
        animation: spin 35s linear infinite;
      }
      .clock-hand-hour {
        transform-origin: 1040px 180px;
        animation: spin 24s linear infinite;
      }
      .clock-hand-minute {
        transform-origin: 1040px 180px;
        animation: spin 6s linear infinite;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite;
      }
      .float-pill-1 {
        animation: float 6s ease-in-out infinite;
      }
      .float-pill-2 {
        animation: float 8s ease-in-out infinite reverse;
      }
      .float-pill-3 {
        animation: float 7s ease-in-out infinite 1s;
      }
      .dash-flow {
        stroke-dasharray: 8 6;
        animation: dash 20s linear infinite;
      }
      @keyframes spin {
        100% { transform: rotate(360deg); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      .font-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
      }
      .font-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .font-code {
        font-family: 'Fira Code', 'Courier New', monospace;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in background -->
  <circle cx="150" cy="80" r="140" fill="url(#accentCyan)" filter="blur(50px)" class="pulse-circle" />
  <circle cx="1050" cy="220" r="160" fill="url(#accentPurple)" filter="blur(60px)" class="pulse-circle" />

  <!-- Animated Flow Lines in background -->
  <path d="M 50 300 C 350 260, 650 340, 1150 280" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.35" class="dash-flow" />
  <path d="M 80 80 C 400 130, 800 40, 1120 100" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" class="dash-flow" />

  <!-- Dynamic Background Clock Mechanism on the Right -->
  <g opacity="0.6">
    <circle cx="1040" cy="180" r="110" fill="none" stroke="#4f46e5" stroke-width="2" stroke-opacity="0.4" />
    <circle cx="1040" cy="180" r="90" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="12 16" class="clock-ring" />
    <circle cx="1040" cy="180" r="70" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6 8" class="clock-ring" style="animation-direction: reverse; animation-duration: 20s;" />
    <!-- Clock Center & Hands -->
    <circle cx="1040" cy="180" r="5" fill="#38bdf8" />
    <line x1="1040" y1="180" x2="1040" y2="130" stroke="#c084fc" stroke-width="3.5" stroke-linecap="round" class="clock-hand-hour" />
    <line x1="1040" y1="180" x2="1040" y2="105" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" class="clock-hand-minute" />
  </g>

  <!-- Dynamic Floating Decorative Tags in Middle-Right Background -->
  <g class="float-pill-1" transform="translate(820, 70)" opacity="0.85">
    <rect width="135" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <text x="67" y="22" fill="#38bdf8" font-size="13" text-anchor="middle" class="font-code">UTC / IANA 🌐</text>
  </g>
  <g class="float-pill-2" transform="translate(740, 240)" opacity="0.85">
    <rect width="165" height="34" rx="17" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" />
    <text x="82" y="22" fill="#d8b4fe" font-size="13" text-anchor="middle" class="font-code">ISO-8601 &amp; RFC ⚡</text>
  </g>
  <g class="float-pill-3" transform="translate(930, 260)" opacity="0.85">
    <rect width="155" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
    <text x="77" y="22" fill="#6ee7b7" font-size="13" text-anchor="middle" class="font-code">Immutable &amp; TZ ⏱️</text>
  </g>

  <!-- Clear Foreground Content (Title & Subtitle - Cleanly separated and unobstructed) -->
  <g transform="translate(70, 0)">
    <!-- Badge Pill -->
    <g transform="translate(0, 60)">
      <rect width="260" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#22c55e" />
      <text x="28" y="19" fill="#e0e7ff" font-size="12" class="font-code" letter-spacing="1">CURATED DEVELOPER ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="150" fill="url(#titleGrad)" font-size="46" class="font-title" letter-spacing="-0.5">
      Awesome Date &amp; Time
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="195" fill="#f8fafc" font-size="22" class="font-sub" opacity="0.95">
      Modern Date Manipulation, Timezone Parsing &amp; Scheduling Utilities
    </text>

    <!-- Detailed Highlights / Pills -->
    <g transform="translate(0, 230)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="170" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
      <text x="85" y="23" fill="#cbd5e1" font-size="13" text-anchor="middle" class="font-sub">⚡ Tree-Shakeable APIs</text>

      <!-- Item 2 -->
      <rect x="180" y="0" width="180" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
      <text x="270" y="23" fill="#cbd5e1" font-size="13" text-anchor="middle" class="font-sub">🔒 Immutability First</text>

      <!-- Item 3 -->
      <rect x="370" y="0" width="175" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
      <text x="457" y="23" fill="#cbd5e1" font-size="13" text-anchor="middle" class="font-sub">🌍 Full Timezone Support</text>

      <!-- Item 4 -->
      <rect x="555" y="0" width="165" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
      <text x="637" y="23" fill="#cbd5e1" font-size="13" text-anchor="middle" class="font-sub">☁️ High-Availability SaaS</text>
    </g>

    <!-- Bottom Metadata Status -->
    <text x="2" y="305" fill="#94a3b8" font-size="13" class="font-code">
      ★ Open-Source Libraries  •  SaaS APIs  •  Temporal Standards  •  Regularly Updated
    </text>
  </g>
</svg>
